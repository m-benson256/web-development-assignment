<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NTARE SCHOOL</title>
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="shortcut icon" href="favicon-32x32.png">
        <style>
            body{
                background-color:#faf7f2;
                background-image: url('Lion2-1140x694.webp');
                backdrop-filter: blur(60px);
                background-size: cover;
            }
            .logo{
                text-align: center;
            }
            #contact-us{
                text-align: center;
                color: #333;
                margin-bottom: 20px;
               
            }
            .arrange{
                display: flex;
                flex-wrap: wrap;
                gap: 30px;
                margin: auto;
                justify-content: space-between;
                max-width: 1200px;
                align-items: flex-start;
            }
            .address{
                background-color: rgba(255, 255, 255, 0.8);
                padding: 20px;
                margin: 40px auto;
                max-width: 300px;
                border-radius: 8px;
                gap: 50px;
                 box-shadow: rgb(22, 22, 22) 0px 4px 12px;
            }
            .form-row input, .form-row textarea{
                width: auto;
                padding: 10px;
                margin-bottom: 20px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            
            button{
                background-color: #4CAF50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            button:hover{
                background-color: #386d5f;
            }
            :root {
      --navy: #0b2545;
      --gold: #d4a017;
      --gold-soft: #f1c75b;
      --cream: #fdf6e3;
      --brick: #8b3a1f;
      --ink: #1a1a1a;
      --muted: #5b6470;
    }
    nav{
   position:sticky;
   top:0;
   z-index:1000;
   margin: 0 auto;
   width: 100%;
}
    nav.tabs {
      
      position: sticky;
      z-index: 10;
      background: var(--navy);
      border-bottom: 3px solid var(--gold);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 3px;
      padding: 5px;
    }
    nav.tabs a {
      color: var(--cream);
      text-decoration: none;
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 10px;
      transition: all 1s ease;
    }
    nav.tabs a:hover { background: var(--gold); 
                       color: var(--navy); }
        </style>
    </head>
    <body>
         <header class="header">
            <h1 class="logo">NTARE SCHOOL</h1>
             <nav class="tabs">
                <a href="index.html">Home</a>

        <section class="contact">
            <div class="arrange">
            <div class="address">
                <h3>Address</h3>
                <p>Ntare road, 256 Mbarara</p>
            </div>
            <div class="address">

                <p>ntare@ntareschool.sc.ug</p>
            </div>
            <div class="address">
                <h3>Phone</h3>
                <p>039-323-8192</p>
            </div>
            
        <form style=" box-shadow: rgb(22, 22, 22) 0px 4px 12px; padding:9px; border-radius:10px" action="mailto:ntare@ntareschool.sc.ug" method="post">
            <div class="form-row">
                <h2>Contact Us</h2>
            </div>
            <div class="form-row">
                <input style="opacity:0.8; padding: 10px; margin-bottom: 20px; border: 1px solid #f3d7d7e7; border-radius: 4px;" type = "text" placeholder="Name*" required><br>
                <input style="opacity:0.8; padding: 10px; margin-bottom: 20px; border: 1px solid #e2b8b8; border-radius: 4px;" type = "email" placeholder="Email*" required><br>
                <input style="opacity:0.8; padding: 10px; margin-bottom: 20px; border: 1px solid #a78e8e; border-radius: 4px;" type = "text" placeholder="Subject*" required><br>

                <textarea style="opacity:0.8; ; padding: 10px; margin-bottom: 20px; border: 1px solid #e5c0c0; border-radius: 4px;" placeholder="MessageUs*" rows="12"></textarea><br>
                <button style="background-color: #97e69a; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;" type="submit">SEND MESSAGE</button>
            </div>
            </div>
        </form>
        </section>
