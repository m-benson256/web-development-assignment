<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTARE SCHOOL</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="shortcut icon" href="favicon-32x32.png">
  
    <style>
        body {
            background:url('biologyclass.jpg') no-repeat center center fixed;
            
            background-size: cover;
            font-family: Arial, sans-serif;
            padding: 50px;
            margin: auto;
            backdrop-filter: blur(100px);

        }
        .gallarytitle {
            text-align: center;
            color: #252525;
            margin-bottom: 20px;
        }
        .button-filter {
            text-align: center;
            button {
                background-color: #68926a;
                color: rgb(27, 20, 20);
                padding: 10px 20px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                margin: 10px;
            } 
        }
        .button-filter button:hover {
            background-color: #d0decf;
        }
        .filter-item {
            width: 300px;
            height: 200px;
            object-fit: cover;
            margin: 10px;
            display: inline-block;
            
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            cursor: pointer;
            
        }
        .gallery img:hover {
            transform: scale(1.05);
            transition: transform 1 ease;
        }

        :root {
      --navy: #0b2545;
      --gold: #d4a017;
      --gold-soft: #f1c75b;
      --cream: #fdf6e3;
      --brick: #8b3a1f;
      --ink: #1a1a1a;
      --muted: #5b6470;
    }
    nav{
   position:sticky;
   top:0;
   z-index:1000;
   width: 100%;
}
    nav.tabs {
      
      position: sticky;
      z-index: 10;
      background: var(--navy);
      border-bottom: 3px solid var(--gold);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 3px;
      padding: 5px;
    }
    nav.tabs a {
      color: var(--cream);
      text-decoration: none;
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 10px;
      transition: all 1s ease;
    }
    nav.tabs a:hover { background: var(--gold); 
                       color: var(--navy); }
    </style>
</head>
<body>
     <header class="header">
            <h1 class="logo" style="text-align: center;">NTARE SCHOOL</h1>
             <nav class="tabs">
                <a href="index.html">Home</a>
                <a href="aboutus.html">About Us</a>
                <a href="academics.html">Academics & Sports</a>
                <a href="gallary.html">Gallery</a>
                <a href="contactUs.html">Contact Us</a>
             </nav>
        </header>
    <h2 class="gallarytitle">NTARE SCHOOL GALLERY</h2>
    <div class="button-filter">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn" data-filter="classrooms">CLASSROOMS</button>
        <button class="filter-btn" data-filter="library">LIBRARY</button>
        <button class="filter-btn" data-filter="campus">CAMPUS</button>
    </div>
    <div class = "gallery" >
        <img style="border-radius: 7px; box-shadow: #1a1a1a 0px 4px 12px;"src="biglap.jpg"  class="filter-item classrooms" alt="The big lab" sizes="auto" title="big lab">
        <img style="border-radius: 7px; box-shadow: #1a1a1a 0px 4px 12px;"src="biologyclass.jpg" class="filter-item classrooms" alt="Biology class in session" title="Class">
        <img style="border-radius: 7px; box-shadow: #1a1a1a 0px 4px 12px;"src="ntareroudabout.jpeg" class="filter-item campus" alt="School roundabout" title="campus">
        <img style="border-radius: 7px; box-shadow: #1a1a1a 0px 4px 12px;"src="oncampus.jpg" class="filter-item campus" alt="Campus areal view" title="campus">
        <img style="border-radius: 7px; box-shadow: #1a1a1a 0px 4px 12px;"src="computerclass.jpg" class="filter-item classrooms" alt="Computer session" title="Class">
        <img style="border-radius: 7px; box-shadow: #1a1a1a 0px 4px 12px;"src="physicsclass.jpg" class="filter-item classrooms" alt="Physics in session" title="Class">
        <img style="border-radius: 7px; box-shadow: #1a1a1a 0px 4px 12px;"src="studentsinlib.jpg" class="filter-item library" alt="Library interior" title="Library">
        <img style="border-radius: 7px; box-shadow: #1a1a1a 0px 4px 12px;"src="studentslibrary.jpg" class="filter-item library" alt="Library outside" title="Library">
        <img src="medicalcamp.jpg" class="filter-item campus" alt="Student's medical camp" title="campus">
    </div>

    <script>
    const filterButtons = document.querySelectorAll(".filter-btn");
    const filterItems = document.querySelectorAll(".filter-item");

    filterButtons.forEach(button => {
        button.addEventListener("click", () => {
            filterButtons.forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");

            const filterValue = button.getAttribute("data-filter");

            filterItems.forEach(item => {
                if (filterValue === "all") {
                    item.style.display = "inline-block";
                } else {
                    if (item.classList.contains(filterValue)) {
                        item.style.display = "inline-block";
                    } else {
                        item.style.display = "none";
                    }
                }
            });
        });
    });
</script>

</body>

</html>
